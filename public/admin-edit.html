<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تعديل العقد - Arresalah Zentrum Berlin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">
    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="fas fa-edit me-2"></i>تعديل بيانات العقد</h2>
            <div>
                <a href="admin.html" class="btn btn-secondary"><i class="fas fa-arrow-right me-1"></i>العودة لوحة الإدارة</a>
                <button type="button" class="btn btn-success ms-2" id="saveAllBtn"><i class="fas fa-save me-1"></i>حفظ التعديلات</button>
            </div>
        </div>

        <div id="alertBox"></div>

        <!-- Contract Meta Info -->
        <div class="card mb-4 shadow-sm">
            <div class="card-body">
                <h5 class="card-title text-primary">معلومات العقد الأساسية</h5>
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">كود العقد</label>
                        <input type="text" class="form-control" id="contractCode" readonly>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">تاريخ العقد</label>
                        <input type="date" class="form-control" id="contractDate">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">الحالة</label>
                        <select class="form-select" id="contractStatus">
                            <option value="draft">مسودة (Draft)</option>
                            <option value="sent">مكتمل / مرسل (Sent)</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tabs Navigation -->
        <ul class="nav nav-tabs" id="editTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="groom-tab" data-bs-toggle="tab" data-bs-target="#groom-pane" type="button" role="tab">الزوج (Groom)</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="bride-tab" data-bs-toggle="tab" data-bs-target="#bride-pane" type="button" role="tab">الزوجة (Bride)</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="wali-tab" data-bs-toggle="tab" data-bs-target="#wali-pane" type="button" role="tab">الولي (Wali)</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="witness1-tab" data-bs-toggle="tab" data-bs-target="#witness1-pane" type="button" role="tab">الشاهد الأول</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="witness2-tab" data-bs-toggle="tab" data-bs-target="#witness2-pane" type="button" role="tab">الشاهد الثاني</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="dowry-tab" data-bs-toggle="tab" data-bs-target="#dowry-pane" type="button" role="tab">المهر (نصوص وأرقام)</button>
            </li>
        </ul>

        <!-- Tabs Content -->
        <div class="tab-content card border-top-0 p-4 shadow-sm" id="editTabContent">
            
            <!-- Groom Pane -->
            <div class="tab-pane fade show active" id="groom-pane" role="tabpanel">
                <h4>بيانات الزوج</h4>
                <div class="row g-3" id="groomForm">
                    <div class="col-md-6"><label class="form-label">الاسم (ألماني)</label><input type="text" class="form-control" data-field="nameDe"></div>
                    <div class="col-md-6"><label class="form-label">الاسم (عربي)</label><input type="text" class="form-control" data-field="nameAr"></div>
                    <div class="col-md-4"><label class="form-label">يوم الميلاد</label><input type="text" class="form-control" data-field="birthDay"></div>
                    <div class="col-md-4"><label class="form-label">شهر الميلاد</label><input type="text" class="form-control" data-field="birthMonth"></div>
                    <div class="col-md-4"><label class="form-label">سنة الميلاد</label><input type="text" class="form-control" data-field="birthYear"></div>
                    <div class="col-md-6"><label class="form-label">دولة الميلاد</label><input type="text" class="form-control" data-field="birthCountry"></div>
                    <div class="col-md-6"><label class="form-label">مدينة الميلاد</label><input type="text" class="form-control" data-field="birthRegion"></div>
                    <div class="col-md-6"><label class="form-label">نوع الهوية</label><input type="text" class="form-control" data-field="idType"></div>
                    <div class="col-md-6"><label class="form-label">رقم الهوية</label><input type="text" class="form-control" data-field="idNumber"></div>
                    <div class="col-md-4"><label class="form-label">رقم الشارع</label><input type="text" class="form-control" data-field="addressNumber"></div>
                    <div class="col-md-8"><label class="form-label">اسم الشارع</label><input type="text" class="form-control" data-field="addressStreet"></div>
                    <div class="col-md-4"><label class="form-label">الرمز البريدي</label><input type="text" class="form-control" data-field="postalCode"></div>
                    <div class="col-md-8"><label class="form-label">المدينة</label><input type="text" class="form-control" data-field="city"></div>
                    <div class="col-md-6"><label class="form-label">اسم الأم (ألماني)</label><input type="text" class="form-control" data-field="motherNameDe"></div>
                    <div class="col-md-6"><label class="form-label">اسم الأم (عربي)</label><input type="text" class="form-control" data-field="motherNameAr"></div>
                </div>
            </div>

            <!-- Bride Pane -->
            <div class="tab-pane fade" id="bride-pane" role="tabpanel">
                <h4>بيانات الزوجة</h4>
                <div class="row g-3" id="brideForm">
                    <div class="col-md-6"><label class="form-label">الاسم (ألماني)</label><input type="text" class="form-control" data-field="nameDe"></div>
                    <div class="col-md-6"><label class="form-label">الاسم (عربي)</label><input type="text" class="form-control" data-field="nameAr"></div>
                    <div class="col-md-4"><label class="form-label">يوم الميلاد</label><input type="text" class="form-control" data-field="birthDay"></div>
                    <div class="col-md-4"><label class="form-label">شهر الميلاد</label><input type="text" class="form-control" data-field="birthMonth"></div>
                    <div class="col-md-4"><label class="form-label">سنة الميلاد</label><input type="text" class="form-control" data-field="birthYear"></div>
                    <div class="col-md-6"><label class="form-label">دولة الميلاد</label><input type="text" class="form-control" data-field="birthCountry"></div>
                    <div class="col-md-6"><label class="form-label">مدينة الميلاد</label><input type="text" class="form-control" data-field="birthRegion"></div>
                    <div class="col-md-6"><label class="form-label">نوع الهوية</label><input type="text" class="form-control" data-field="idType"></div>
                    <div class="col-md-6"><label class="form-label">رقم الهوية</label><input type="text" class="form-control" data-field="idNumber"></div>
                    <div class="col-md-4"><label class="form-label">رقم الشارع</label><input type="text" class="form-control" data-field="addressNumber"></div>
                    <div class="col-md-8"><label class="form-label">اسم الشارع</label><input type="text" class="form-control" data-field="addressStreet"></div>
                    <div class="col-md-4"><label class="form-label">الرمز البريدي</label><input type="text" class="form-control" data-field="postalCode"></div>
                    <div class="col-md-8"><label class="form-label">المدينة</label><input type="text" class="form-control" data-field="city"></div>
                    <div class="col-md-6"><label class="form-label">اسم الأم (ألماني)</label><input type="text" class="form-control" data-field="motherNameDe"></div>
                    <div class="col-md-6"><label class="form-label">اسم الأم (عربي)</label><input type="text" class="form-control" data-field="motherNameAr"></div>
                </div>
            </div>

            <!-- Wali Pane -->
            <div class="tab-pane fade" id="wali-pane" role="tabpanel">
                <h4>بيانات الولي</h4>
                <div class="row g-3" id="waliForm">
                    <div class="col-md-6"><label class="form-label">الاسم (ألماني)</label><input type="text" class="form-control" data-field="nameDe"></div>
                    <div class="col-md-6"><label class="form-label">الاسم (عربي)</label><input type="text" class="form-control" data-field="nameAr"></div>
                    <div class="col-md-4"><label class="form-label">يوم الميلاد</label><input type="text" class="form-control" data-field="birthDay"></div>
                    <div class="col-md-4"><label class="form-label">شهر الميلاد</label><input type="text" class="form-control" data-field="birthMonth"></div>
                    <div class="col-md-4"><label class="form-label">سنة الميلاد</label><input type="text" class="form-control" data-field="birthYear"></div>
                    <div class="col-md-6"><label class="form-label">دولة الميلاد</label><input type="text" class="form-control" data-field="birthCountry"></div>
                    <div class="col-md-6"><label class="form-label">مدينة الميلاد</label><input type="text" class="form-control" data-field="birthRegion"></div>
                    <div class="col-md-6"><label class="form-label">نوع الهوية</label><input type="text" class="form-control" data-field="idType"></div>
                    <div class="col-md-6"><label class="form-label">رقم الهوية</label><input type="text" class="form-control" data-field="idNumber"></div>
                    <div class="col-md-4"><label class="form-label">رقم الشارع</label><input type="text" class="form-control" data-field="addressNumber"></div>
                    <div class="col-md-8"><label class="form-label">اسم الشارع</label><input type="text" class="form-control" data-field="addressStreet"></div>
                    <div class="col-md-4"><label class="form-label">الرمز البريدي</label><input type="text" class="form-control" data-field="postalCode"></div>
                    <div class="col-md-8"><label class="form-label">المدينة</label><input type="text" class="form-control" data-field="city"></div>
                    <div class="col-md-6"><label class="form-label">اسم الأم (ألماني)</label><input type="text" class="form-control" data-field="motherNameDe"></div>
                    <div class="col-md-6"><label class="form-label">اسم الأم (عربي)</label><input type="text" class="form-control" data-field="motherNameAr"></div>
                </div>
            </div>

            <!-- Witness 1 Pane -->
            <div class="tab-pane fade" id="witness1-pane" role="tabpanel">
                <h4>بيانات الشاهد الأول</h4>
                <div class="row g-3" id="witness1Form">
                    <div class="col-md-6"><label class="form-label">الاسم (ألماني)</label><input type="text" class="form-control" data-field="nameDe"></div>
                    <div class="col-md-6"><label class="form-label">الاسم (عربي)</label><input type="text" class="form-control" data-field="nameAr"></div>
                    <div class="col-md-4"><label class="form-label">يوم الميلاد</label><input type="text" class="form-control" data-field="birthDay"></div>
                    <div class="col-md-4"><label class="form-label">شهر الميلاد</label><input type="text" class="form-control" data-field="birthMonth"></div>
                    <div class="col-md-4"><label class="form-label">سنة الميلاد</label><input type="text" class="form-control" data-field="birthYear"></div>
                    <div class="col-md-6"><label class="form-label">دولة الميلاد</label><input type="text" class="form-control" data-field="birthCountry"></div>
                    <div class="col-md-6"><label class="form-label">مدينة الميلاد</label><input type="text" class="form-control" data-field="birthRegion"></div>
                    <div class="col-md-6"><label class="form-label">نوع الهوية</label><input type="text" class="form-control" data-field="idType"></div>
                    <div class="col-md-6"><label class="form-label">رقم الهوية</label><input type="text" class="form-control" data-field="idNumber"></div>
                    <div class="col-md-4"><label class="form-label">رقم الشارع</label><input type="text" class="form-control" data-field="addressNumber"></div>
                    <div class="col-md-8"><label class="form-label">اسم الشارع</label><input type="text" class="form-control" data-field="addressStreet"></div>
                    <div class="col-md-4"><label class="form-label">الرمز البريدي</label><input type="text" class="form-control" data-field="postalCode"></div>
                    <div class="col-md-8"><label class="form-label">المدينة</label><input type="text" class="form-control" data-field="city"></div>
                    <div class="col-md-6"><label class="form-label">اسم الأم (ألماني)</label><input type="text" class="form-control" data-field="motherNameDe"></div>
                    <div class="col-md-6"><label class="form-label">اسم الأم (عربي)</label><input type="text" class="form-control" data-field="motherNameAr"></div>
                </div>
            </div>

            <!-- Witness 2 Pane -->
            <div class="tab-pane fade" id="witness2-pane" role="tabpanel">
                <h4>بيانات الشاهد الثاني</h4>
                <div class="row g-3" id="witness2Form">
                    <div class="col-md-6"><label class="form-label">الاسم (ألماني)</label><input type="text" class="form-control" data-field="nameDe"></div>
                    <div class="col-md-6"><label class="form-label">الاسم (عربي)</label><input type="text" class="form-control" data-field="nameAr"></div>
                    <div class="col-md-4"><label class="form-label">يوم الميلاد</label><input type="text" class="form-control" data-field="birthDay"></div>
                    <div class="col-md-4"><label class="form-label">شهر الميلاد</label><input type="text" class="form-control" data-field="birthMonth"></div>
                    <div class="col-md-4"><label class="form-label">سنة الميلاد</label><input type="text" class="form-control" data-field="birthYear"></div>
                    <div class="col-md-6"><label class="form-label">دولة الميلاد</label><input type="text" class="form-control" data-field="birthCountry"></div>
                    <div class="col-md-6"><label class="form-label">مدينة الميلاد</label><input type="text" class="form-control" data-field="birthRegion"></div>
                    <div class="col-md-6"><label class="form-label">نوع الهوية</label><input type="text" class="form-control" data-field="idType"></div>
                    <div class="col-md-6"><label class="form-label">رقم الهوية</label><input type="text" class="form-control" data-field="idNumber"></div>
                    <div class="col-md-4"><label class="form-label">رقم الشارع</label><input type="text" class="form-control" data-field="addressNumber"></div>
                    <div class="col-md-8"><label class="form-label">اسم الشارع</label><input type="text" class="form-control" data-field="addressStreet"></div>
                    <div class="col-md-4"><label class="form-label">الرمز البريدي</label><input type="text" class="form-control" data-field="postalCode"></div>
                    <div class="col-md-8"><label class="form-label">المدينة</label><input type="text" class="form-control" data-field="city"></div>
                    <div class="col-md-6"><label class="form-label">اسم الأم (ألماني)</label><input type="text" class="form-control" data-field="motherNameDe"></div>
                    <div class="col-md-6"><label class="form-label">اسم الأم (عربي)</label><input type="text" class="form-control" data-field="motherNameAr"></div>
                </div>
            </div>

            <!-- Dowry Pane - Text & Numbers Supported -->
            <div class="tab-pane fade" id="dowry-pane" role="tabpanel">
                <h4>بيانات المهر </h4>
                <div class="row g-3" id="dowryForm">
                    <div class="col-md-6">
                        <label class="form-label">المهر المعجل (Advance Dowry)</label>
                        <input type="text" class="form-control" data-field="amountAdvance" placeholder="مثال: 5000 يورو (خمسة آلاف)">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">المهر المؤجل (Deferred Dowry)</label>
                        <input type="text" class="form-control" data-field="amountDeferred" placeholder="مثال: مؤجل إلى حين الطلاق أو الوفاة">
                    </div>
                    <div class="col-md-12">
                        <label class="form-label">ملاحظات المهر</label>
                        <textarea class="form-control" data-field="notes" rows="3" placeholder="تفاصيل إضافية..."></textarea>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/admin-edit.js"></script>
</body>
</html>
