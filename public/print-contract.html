<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>شهادة عقد زواج - Arresalah Zentrum</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/print.css?v=24">

<!-- مكتبة تحويل الشاشة إلى PDF مقاس A4 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
  /* إعدادات الملاحظات */
  .notes-full-row, 
  .wali-dowry-col .wd-row.notes-box {
    margin-top: 4px !important;
    padding: 4px 6px !important;
    background: #fdfdfd !important;
    border: 1px solid #d0d7de !important;
    border-radius: 4px !important;
    width: 100% !important;
    box-sizing: border-box !important;
  }
  
  .notes-full-row .wd-value, 
  .wali-dowry-col .wd-row.notes-box .wd-value,
  .bemerkungen-text,
  .wd-value {
    font-family: 'Tajawal', 'Noto Naskh Arabic', sans-serif !important;
    font-size: 10px !important; 
    line-height: 1.3 !important;
    color: #333 !important;
    unicode-bidi: plaintext !important;
    direction: auto !important;
    text-align: right !important;
    white-space: pre-wrap !important;
    word-break: break-word !important;
  }
</style>
</head>
<body>

<!-- شاشة التحميل -->
<div id="loadingScreen" class="loading-screen">
  <div class="spinner"></div>
  <p>جارٍ تحضير الشهادة للطباعة...</p>
</div>

<!-- شاشة الخطأ -->
<div id="errorScreen" class="error-screen hidden">
  <div class="error-box">
    <div class="error-icon">⚠️</div>
    <h2 id="errorTitle">خطأ</h2>
    <p id="errorMessage">حدث خطأ غير متوقع</p>
    <button onclick="window.close()" class="btn-back">إغلاق</button>
  </div>
</div>

<!-- شريط الأدوات (لا يُطبع) -->
<div id="toolbar" class="toolbar hidden">
  <div class="toolbar-left">
    <button onclick="window.print()" class="btn-print">
      🖨 طباعة
    </button>
    <button onclick="downloadPDF()" class="btn-pdf">
      📄 تحميل PDF (A4)
    </button>
  </div>
  <div class="toolbar-center">
    <span class="toolbar-code">رقم العقد: <strong id="toolbarCode">—</strong></span>
  </div>
  <div class="toolbar-right">
    <button onclick="window.close()" class="btn-close">
      ✕ إغلاق
    </button>
  </div>
</div>

<!-- الشهادة -->
<div id="certificateWrap" class="certificate-wrap hidden">
  <div class="certificate" id="certificate">
    <!-- سيتم بناؤه بواسطة JS -->
  </div>
</div>

<script src="./js/print.js?v=24"></script>
</body>
</html>
