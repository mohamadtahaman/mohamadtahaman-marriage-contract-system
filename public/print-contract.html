<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>شهادة عقد زواج - Arresalah Zentrum</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;700&display=swap" rel="stylesheet">
<!-- تم زيادة رقم الإصدار عشان نكسر الكاش -->
<link rel="stylesheet" href="./css/print.css?v=6">

<style>
  /* =========================================
     1. تعديلات الملاحظات (Bemerkungen)
     ========================================= */
  .notes-full-row, 
  .wali-dowry-col .wd-row.notes-box {
    margin-top: 4px !important;
    padding: 4px 6px !important;
    background: #fdfdfd !important;
    border: 1px solid #d0d7de !important;
    border-radius: 4px !important;
    width: 100% !important;
    box-sizing: border-box !important;
  }
  
  /* إجبار الخط والصغر على الملاحظات عشان نوحد شكله */
  .notes-full-row .wd-value, 
  .wali-dowry-col .wd-row.notes-box .wd-value,
  .bemerkungen-text,
  .wd-value {
    font-family: 'Tajawal', 'Noto Naskh Arabic', sans-serif !important;
    font-size: 10px !important; 
    line-height: 1.3 !important;
    color: #333 !important;
    unicode-bidi: plaintext !important;
    direction: auto !important;
    text-align: right !important;
    white-space: pre-wrap !important;
    word-break: break-word !important;
  }

  /* =========================================
     2. صورة logo2 كخلفية مكررة (Watermark) للجزء العلوي فقط
     ========================================= */
  .certificate {
    position: relative !important;
    background-color: #fff !important;
  }

  /* اللوجو كخلفية شفافة ومكررة في الجزء العلوي فقط */
  .certificate::before {
    content: "";
    position: absolute !important;
    top: 0 !important;
    left: 0 !important;
    width: 100% !important; /* تغطية العرض بالكامل */
    height: 190px !important; /* تقليل الارتفاع عشان يقف قبل الخط الفاصل */
    background-image: url('./imeges/logo2.webp') !important; 
    background-repeat: repeat !important; /* تكرار في كل الاتجاهات */
    background-position: top center !important;
    background-size: 100px 100px !important; /* تصغير حجم اللوجو المكرر */
    opacity: 0.35 !important; /* درجة وضوح مريحة للعين */
    z-index: 0 !important;
    pointer-events: none !important;
  }

  /* التأكد إن كل المحتوى فوق صورة الخلفية */
  .certificate > * {
    position: relative !important;
    z-index: 1 !important;
  }

  /* =========================================
     3. ضبط الطباعة عشان تدخل في ورقة A4 واحدة
     ========================================= */
  @media print {
    @page {
      size: A4 portrait !important;
      margin: 2mm 4mm !important; /* تقليل الهوامش الخارجية جداً */
    }

    body {
      background: white !important;
      zoom: 0.80 !important; /* تصغير الحجم لـ 80% عشان العقد كله يدخل في صفحة واحدة */
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    /* إخفاء شريط الأدوات */
    .toolbar, #toolbar {
      display: none !important;
    }

    /* تقليل المسافات بين الصفوف والجداول */
    table, tr, td, th, .certificate-row, .party-box {
      margin-top: 0 !important;
      margin-bottom: 0 !important;
      padding-top: 1px !important;
      padding-bottom: 1px !important;
    }

    /* منع قطع الصفحة جوه أي مربع أو جدول */
    .certificate, table, tr, td {
      page-break-inside: avoid !important;
      break-inside: avoid !important;
    }
  }
</style>

</head>
<body>

<!-- شاشة التحميل -->
<div id="loadingScreen" class="loading-screen">
  <div class="spinner"></div>
  <p>جارٍ تحضير الشهادة للطباعة...</p>
</div>

<!-- شاشة الخطأ -->
<div id="errorScreen" class="error-screen hidden">
  <div class="error-box">
    <div class="error-icon">⚠️</div>
    <h2 id="errorTitle">خطأ</h2>
    <p id="errorMessage">حدث خطأ غير متوقع</p>
    <button onclick="window.close()" class="btn-back">إغلاق</button>
  </div>
</div>

<!-- شريط الأدوات (لا يُطبع) -->
<div id="toolbar" class="toolbar hidden">
  <div class="toolbar-left">
    <button onclick="window.print()" class="btn-print">
      🖨 طباعة
    </button>
    <button onclick="downloadPDF()" class="btn-pdf">
      📄 تحميل PDF
    </button>
  </div>
  <div class="toolbar-center">
    <span class="toolbar-code">رقم العقد: <strong id="toolbarCode">—</strong></span>
  </div>
  <div class="toolbar-right">
    <button onclick="window.close()" class="btn-close">
      ✕ إغلاق
    </button>
  </div>
</div>

<!-- الشهادة -->
<div id="certificateWrap" class="certificate-wrap hidden">
  <div class="certificate" id="certificate">
    <!-- سيتم بناؤه بواسطة JS -->
  </div>
</div>

<script src="./js/print.js?v=6"></script>
</body>
</html>
