<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>شهادة عقد زواج - Arresalah Zentrum</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/print.css?v=1">
<style>
  /* تنسيق صندوق الملاحظات ليطابق حدود المربع الأخضر والخطوط المسطرة بدقة */
  .notes-full-row {
    margin: 6px 0;
    padding: 8px 12px;
    background: #fff;
    border: 1.5px solid #1a4d8a;
    border-radius: 6px;
    width: 100%;
    box-sizing: border-box;
    /* خطوط أفقية مسطرة تشبه الخطوط الحمراء داخل المربع الأخضر */
    background-image: repeating-linear-gradient(
      transparent,
      transparent 26px,
      #e8d0d0 26px,
      #e8d0d0 27px
    );
    background-attachment: local;
  }
  .notes-full-row .wd-label {
    font-weight: bold;
    display: flex;
    justify-content: space-between;
    margin-bottom: 6px;
    font-size: 12px;
    color: #1a4d8a;
    border-bottom: 1px dashed #1a4d8a;
    padding-bottom: 3px;
    background: #fff; /* عزل العنوان عن الخطوط المسطرة */
  }
  .notes-full-row .wd-value {
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 12px;
    line-height: 27px; /* مسافة متطابقة تماماً مع الخطوط المسطرة لتستقر عليها الكتابة */
    color: #111;
    text-align: right;
    direction: rtl;
  }
<style>
  /* تنسيق صندوق الملاحظات ليكون مضبوطاً داخل حدود العقد ومنضبطاً لليمين */
  .notes-full-row {
    margin: 8px 0;
    padding: 8px 12px;
    background: #ffffff;
    border: 1.5px solid #1a4d8a;
    border-radius: 6px;
    width: 100%;
    box-sizing: border-box;
    direction: rtl;
    text-align: right;
  }
  .notes-full-row .wd-label {
    font-weight: bold;
    display: flex;
    justify-content: space-between;
    margin-bottom: 6px;
    font-size: 12px;
    color: #1a4d8a;
    border-bottom: 1px dashed #1a4d8a;
    padding-bottom: 4px;
  }
  .notes-full-row .wd-value {
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 12px;
    line-height: 22px;
    color: #222222;
    text-align: right;
    direction: rtl;
    display: block;
  }
</style>

</head>
<body>

<!-- شاشة التحميل -->
<div id="loadingScreen" class="loading-screen">
  <div class="spinner"></div>
  <p>جارٍ تحضير الشهادة للطباعة...</p>
</div>

<!-- شاشة الخطأ -->
<div id="errorScreen" class="error-screen hidden">
  <div class="error-box">
    <div class="error-icon">⚠️</div>
    <h2 id="errorTitle">خطأ</h2>
    <p id="errorMessage">حدث خطأ غير متوقع</p>
    <button onclick="window.close()" class="btn-back">إغلاق</button>
  </div>
</div>

<!-- شريط الأدوات (لا يُطبع) -->
<div id="toolbar" class="toolbar hidden">
  <div class="toolbar-left">
    <button onclick="window.print()" class="btn-print">
      🖨 طباعة
    </button>
    <button onclick="downloadPDF()" class="btn-pdf">
      📄 تحميل PDF
    </button>
  </div>
  <div class="toolbar-center">
    <span class="toolbar-code">رقم العقد: <strong id="toolbarCode">—</strong></span>
  </div>
  <div class="toolbar-right">
    <button onclick="window.close()" class="btn-close">
      ✕ إغلاق
    </button>
  </div>
</div>

<!-- الشهادة -->
<div id="certificateWrap" class="certificate-wrap hidden">
  <div class="certificate" id="certificate">
    <!-- سيتم بناؤه بواسطة JS -->
  </div>
</div>

<script src="./js/print.js?v=1"></script>
</body>
</html>
