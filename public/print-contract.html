<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>شهادة عقد زواج - Arresalah Zentrum</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;700&display=swap" rel="stylesheet">
<link rel="styleshee
  t" href="./css/print.css?v=1">
<style>
  .notes-full-row {
    margin: 8px 10px 4px 10px;
    padding: 6px 12px;
    background: #fdfdfd;
    border: 1px solid #d0d7de;
    border-radius: 6px;
    box-sizing: border-box;
    max-width: calc(100% - 20px);
    overflow: hidden;
  }
  .notes-full-row .wd-label {
    font-weight: bold;
    display: flex;
    justify-content: space-between;
    margin-bottom: 3px;
    font-size: 11px;
    color: #1a4d8a;
  }
  .notes-full-row .wd-value {
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 12px;
    line-height: 1.4;
    color: #222;
    text-align: right;
  }
  /* تنسيقات لضمان توافق العرض مع سكريبت الطباعة (print.js) وتجنب ظهور الصفحة فارغة */
  .cert-header { grid-template-columns: 1fr !important; }
  .cert-header-photo { display: none !important; }
  .cert-info-strip .info-line { justify-content: center !important; }
  
  /* جعل خانة الملاحظات تأخذ العرض بالكامل أفقياً */
  .notes-row, .notes-full-row, [class*="notes"] {
    grid-column: 1 / -1 !important;
    width: 100% !important;
  }

  @media print {
    @page { size: A4 portrait; margin: 0; }
    html, body {
      background: #fff;
      margin: 0 !important;
      padding: 0 !important;
      width: 210mm !important;
      height: 297mm !important;
      overflow: hidden !important;
    }
    .toolbar { display: none !important; }
    .certificate-wrap, .cert-wrap-screen {
      margin: 0 !important;
      padding: 4mm !important;
      width: 100% !important;
      height: 100% !important;
      box-sizing: border-box !important;
    }
    .certificate {
      border: 3px solid #1a4d8a !important;
      padding: 6px !important;
      height: 100% !important;
      box-sizing: border-box !important;
      overflow: hidden !important;
    }
  }
</style>
</head>
<body>

<!-- شاشة التحميل -->
<div id="loadingScreen" class="loading-screen">
  <div class="spinner"></div>
  <p>جارٍ تحضير الشهادة للطباعة...</p>
</div>

<!-- شاشة الخطأ -->
<div id="errorScreen" class="error-screen hidden">
  <div class="error-box">
    <div class="error-icon">⚠️</div>
    <h2 id="errorTitle">خطأ</h2>
    <p id="errorMessage">حدث خطأ غير متوقع</p>
    <button onclick="window.close()" class="btn-back">إغلاق</button>
  </div>
</div>

<!-- شريط الأدوات (لا يُطبع) -->
<div id="toolbar" class="toolbar hidden">
  <div class="toolbar-left">
    <button onclick="window.print()" class="btn-print">
      🖨 طباعة
    </button>
    <button onclick="downloadPDF()" class="btn-pdf">
      📄 تحميل PDF
    </button>
  </div>
  <div class="toolbar-center">
    <span class="toolbar-code">رقم العقد: <strong id="toolbarCode">—</strong></span>
  </div>
  <div class="toolbar-right">
    <button onclick="window.close()" class="btn-close">
      ✕ إغلاق
    </button>
  </div>
</div>

<!-- الشهادة (تعتمد على print.js لملء البيانات بناءً على الهيكل الأصلي) -->
<div id="certificateWrap" class="certificate-wrap hidden">
  <div class="certificate" id="certificate">
    <!-- سيتم بناؤه بواسطة السكريبت ديناميكياً -->
  </div>
</div>

<script src="./js/print.js?v=1"></script>
</body>
</html>
